name: Deployment Pipeline - CI, Acceptance & Rollback

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Stage 1 - Build y Compilación
        run: mvn clean compile

      - name: Stage 2 - Pruebas Unitarias e Integración
        run: mvn test -Dtest=CalculadoraTest,CalculadoraIntegrationTest

      - name: Stage 3 - Acceptance Test Gate
        run: mvn test -Dtest=AcceptanceTest

      - name: Stage 4 - Despliegue en Ambiente de Pruebas (Canary Release)
        if: success()
        run: |
          echo "Ejecutando despliegue progresivo Canary (10% de tráfico inicial)..."
          echo "Despliegue en Staging finalizado con éxito."

      - name: Stage 5 - Rollback Automático ante Fallo
        if: failure()
        run: |
          echo "⚠️ Fallo detectado en las pruebas de aceptación o build."
          echo "Ejecutando script de Rollback a la versión anterior estable..."
          echo "Tráfico redirigido y ambiente restaurado."

      - name: Stage 6 - Publicación de Artefactos de Reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas-despliegue
          path: target/surefire-reports/
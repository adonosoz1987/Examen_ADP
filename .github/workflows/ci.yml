name: Pipeline CI - Build y Pruebas Automatizadas

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar entorno Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Stage 1 - Build y Compilación
        run: mvn clean compile

      - name: Stage 2 - Ejecución de Pruebas Automatizadas
        run: mvn test

      - name: Stage 3 - Publicación de Artefactos de Reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas-maven
          path: target/surefire-reports/